# Tests only. Deploys are handled by Vercel's Git integration (push → preview, master → production).
name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: budget
          POSTGRES_USER: home_u
          POSTGRES_PASSWORD: home_p
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U home_u -d budget"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: sh mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Same npm as package.json "packageManager"; newer npm rejects this lockfile.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")" && npm ci
      - run: npm test -- --watch=false
