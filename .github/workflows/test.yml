# Tests only. Deploys are handled by Vercel's Git integration (push → preview, master → production).
name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    # Tests start their own Postgres via Testcontainers (Docker is preinstalled on the runner).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: sh mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Same npm as package.json "packageManager"; newer npm rejects this lockfile.
      - run: npm install -g "$(node -p "require('./package.json').packageManager")" && npm ci
      - run: npm test -- --watch=false
