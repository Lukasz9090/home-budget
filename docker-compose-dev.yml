services:
  postgres:
    image: postgres:16-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: home_u
      POSTGRES_PASSWORD: home_p
    ports:
      - "5432:5432"
    volumes:
      - budget-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_u -d budget"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  budget-postgres-data: