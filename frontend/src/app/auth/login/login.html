<main class="flex min-h-dvh items-center justify-center px-4">
  <div class="flex w-full max-w-100 flex-col gap-6">
    <p class="text-center text-xl font-semibold">PennyPlan</p>

    <section hlmCard>
      <div hlmCardContent class="flex flex-col gap-6">
        <h1 class="text-2xl font-semibold">Zaloguj się</h1>

        <form class="flex flex-col gap-6" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          @if (error(); as message) {
            <div hlmAlert variant="destructive">
              <p hlmAlertDescription>{{ message }}</p>
            </div>
          }

          <div hlmFieldGroup>
            <div hlmField>
              <label hlmLabel for="login-email">E-mail</label>
              <input
                hlmInput
                id="login-email"
                type="email"
                formControlName="email"
                autocomplete="email"
              />
              <hlm-field-error id="login-email-error">
                @if (form.controls.email.hasError('required')) {
                  Podaj adres e-mail.
                } @else {
                  Podaj poprawny adres e-mail.
                }
              </hlm-field-error>
            </div>

            <div hlmField>
              <label hlmLabel for="login-password">Hasło</label>
              <input
                hlmInput
                id="login-password"
                type="password"
                formControlName="password"
                autocomplete="current-password"
              />
              <hlm-field-error id="login-password-error">Podaj hasło.</hlm-field-error>
            </div>
          </div>

          <button hlmBtn type="submit" class="w-full" [disabled]="form.invalid || pending()">
            @if (pending()) {
              <hlm-spinner aria-hidden="true" />
            }
            {{ pending() ? 'Logowanie…' : 'Zaloguj się' }}
          </button>
        </form>
      </div>
    </section>

    <a hlmBtn variant="link" routerLink="/register" class="w-full">Nie masz konta? Załóż konto</a>
  </div>
</main>
